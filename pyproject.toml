[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-translator"
version = "0.2.4"
description = "Position-preserving PDF translation and review desktop application"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "foogtil" }]
keywords = ["pdf", "translation", "ocr", "layout", "pymupdf", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "PyMuPDF==1.27.2.3", "Pillow==12.2.0", "httpx==0.28.1",
  "rapidocr-onnxruntime==1.2.3", "onnxruntime>=1.20,<2",
  "opencv-python>=4.10,<6", "numpy>=1.26,<3", "tkinterdnd2==0.4.3"
]

[project.urls]
Homepage = "https://github.com/foogtil/PaperTranslator"
Source = "https://github.com/foogtil/PaperTranslator"
Issues = "https://github.com/foogtil/PaperTranslator/issues"

[project.scripts]
paper-translator = "papertranslator.__main__:main"

[tool.setuptools.packages.find]
include = ["papertranslator*"]
